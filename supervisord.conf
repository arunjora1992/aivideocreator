[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

; Remotion Studio — the live preview / render page, embedded in the GUI's first tab.
[program:studio]
command=npx remotion studio --port %(ENV_STUDIO_PORT)s --host 0.0.0.0
directory=/app/remotion
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Claude CLI in a web terminal — sign in with your Claude account via /login.
[program:claude]
command=ttyd --writable -p %(ENV_TTYD_PORT)s /usr/local/bin/claude-shell.sh
directory=/root
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The tabbed GUI + API (voiceover, render, output download).
[program:gui]
command=node gui/server.mjs
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
