worker_processes auto;
events { worker_connections 1024; }

http {
  # Default 1m limit is too small for uploaded voice clips / presenter photos.
  client_max_body_size 100m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Docker's embedded DNS. Using a variable in proxy_pass (below) forces
  # nginx to re-resolve per this TTL instead of caching the aivideocreator
  # container's IP forever — otherwise every `docker compose up` recreate
  # (new IP) leaves nginx proxying to a dead address until it's restarted.
  resolver 127.0.0.11 valid=10s;

  # GUI (Script / Voiceover / Render tabs + API). Self-contained https origin
  # so getUserMedia (voice recording) works regardless of host/IP used.
  server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    set $gui_upstream aivideocreator:8080;
    location / {
      proxy_pass http://$gui_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # Remotion Studio, embedded as an iframe by the GUI's Studio tab.
  server {
    listen 3443 ssl;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    set $studio_upstream aivideocreator:3000;
    location / {
      proxy_pass http://$studio_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # ttyd web terminal (Claude CLI), embedded as an iframe by the GUI's Claude tab.
  server {
    listen 7443 ssl;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    set $ttyd_upstream aivideocreator:7681;
    location / {
      proxy_pass http://$ttyd_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
